# fleek configuration
#
# Copy this file to ~/.config/fleek/config.toml, or point fleek at it:
#   fleek --config path/to/config.toml
#
# Environment variables override the matching settings:
#   FLEEK_PROTOCOL, FLEEK_CACHE_DIR, FLEEK_FONT, FLEEK_CONFIG

[theme]
background = "#1e1e2e"
sidebar = "#181825"
topbar = "#181825"
status = "#1e1e2e"
panel = "#1e1e2e"
accent = "#cba6f7"
selected = "#313244"
text = "#cdd6f4"
muted = "#a6adc8"
faint = "#6c7086"
dimmer = "#585b70"
hover = "#45475a"
sidebar_active = "#313244"
sidebar_text = "#a6adc8"
search_background = "#313244"

[behavior]
show_hidden = false
# name, size, or modified
sort = "name"
directories_first = true

[layout]
# sidebar_width: 14-32, card_width: 25-40, gap: 1-4
sidebar_width = 20
card_width = 25
gap = 2

[images]
# auto, tgp, or halfblock
protocol = "auto"

# Add extra sidebar places. Paths support ~ and environment variables.
# [[places]]
# label = "Code"
# path = "~/code"
# icon = "code"      # home, download, document, music, picture, video, code, trash, disk, folder
# color = "#7aa2f7"
